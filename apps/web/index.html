<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HireStack — Free ATS Resume Kit</title>
  <meta name="description" content="Get the free HireStack ATS resume kit with templates and a practical keyword checklist." />
  <style>
    :root { font-family: system-ui, sans-serif; color: #e8eef4; background: #0f1419; }
    body { margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 4rem 1.25rem; }
    h1 { line-height: 1.1; max-width: 14ch; }
    p { color: #9aa8b5; font-size: 1.1rem; max-width: 55ch; }
    form { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 2rem; }
    input { padding: .85rem 1rem; border-radius: 8px; border: 1px solid #2a3542; background: #1a222c; color: #e8eef4; min-width: 240px; }
    button { padding: .85rem 1.2rem; border: 0; border-radius: 999px; background: linear-gradient(135deg, #3dd6c6, #5b8cff); color: #061016; font-weight: 700; cursor: pointer; }
    small { color: #9aa8b5; display: block; margin-top: .75rem; }
  </style>
</head>
<body>
  <main>
    <p>HIRESTACK · FREE DIGITAL KIT</p>
    <h1>Stop losing interviews to the ATS.</h1>
    <p>Get clean, ATS-friendly resume templates and a practical keyword checklist to tailor your next application. No subscription and no live scanner.</p>
    <form action="https://formspree.io/f/your-form-id" method="POST">
      <label for="email" class="sr-only">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      <button type="submit">Get the free HireStack kit</button>
    </form>
    <small>We’ll email the free kit and occasional product updates. Paid updates may come later.</small>
  </main>
</body>
</html>
